versioning:
  scheme: none-published
  detail: >
    No API version scheme of AutoGrid's own. Version identity is carried entirely by the
    protocol standards it certified against - OpenADR profile 2.0a / 2.0b, IEEE 2030.5-2018
    CSIP - and by product firmware/software versions in the certification records
    (OpenDR Server firmware 1.7 and 1; ieee-2030-5 software 1.0).
