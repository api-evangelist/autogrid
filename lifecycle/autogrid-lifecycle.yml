method: searched
source: >
  Live probes of auto-grid.com and its subdomains, the Uplight acquisition press release,
  the OpenADR and SunSpec certified-product registries, and Wayback Machine CDX queries.
  All 2026-07-27.
note: >
  AutoGrid publishes no API versioning policy, no deprecation policy, no SLA and no status
  page - it publishes nothing at all. What this artifact records instead is the PLATFORM
  lifecycle: an acquired company whose brand surface has been retired into its acquirer,
  with certifications that are still listed but no longer maintained under the AutoGrid
  name. Recording this is the point - a consumer looking at AutoGrid needs to know the
  surface is gone and where it went.
status: retired
status_detail: >
  The AutoGrid brand no longer operates a web, developer or documentation presence. The
  products (AutoGrid Flex, AutoGrid DROMS) live on inside Uplight. No StatusPage or
  Deprecation pointer is emitted in apis.yml because neither a status page nor a
  deprecation policy exists - the surface was withdrawn without either.
