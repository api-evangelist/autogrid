aid: autogrid
name: AutoGrid
review:
  question: Does AutoGrid publish a public, documented API — and does any energy data
    mandate apply to it?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: grid-tech-derms
  homeMarket: United States
  specsHarvested: 0
  openapiHarvested: false
  developerPortal: ''
  portalConfirmed: false

identity:
  legalName: AutoGrid Systems, Inc.
  founded: 2011
  founder: Amit Narayan
  headquarters: Redwood City / Redwood Shores, California, United States
  headquartersSource: |
    github.com/auto-grid organization profile (fetched 2026-07-27, HTTP 200):
    location "Redwood Shores, CA", blog "http://auto-grid.com",
    email "info@auto-grid.com", org created 2011-04-06.
  segment: Grid technology — DERMS, virtual power plants, automated demand response
  flagshipProduct: AutoGrid Flex (AI/ML DER management and VPP platform)
  ownership: |
    Schneider Electric held/controlled AutoGrid and then sold it to Uplight. The
    acquisition was announced 2023-12-14 and closed in early 2024. Verified at
    https://uplight.com/press/uplight-to-acquire-autogrid/ (HTTP 200, fetched
    2026-07-27), which states the deal, the Schneider Electric ownership, 700+
    combined employees, and 8,300 MW of flexible resources under management.
  currentStatus: |
    AutoGrid no longer operates an independent web or developer presence. Its
    domain is a redirect stub pointing at its acquirer.

mandate:
  regime: none
  regimeRationale: |
    The energy sector's data-sharing obligations attach to DATA CUSTODIANS —
    utilities, retailers, and metering parties. Green Button (NAESB REQ.21 / ESPI)
    is a voluntary US standard adopted by utilities; Ontario mandates it by
    regulation for Ontario distributors; Australia extended the Consumer Data Right
    to energy for designated retailers and AEMO. AutoGrid is none of these. It is a
    US software vendor that sells DERMS/VPP orchestration software TO utilities. No
    Green Button obligation, no CDR designation, no smart-meter infrastructure
    mandate reaches it.
  status: not-applicable
  statusRationale: |
    No obligation was found, and AutoGrid makes no compliance claim that could be
    tested. This is a genuine not-applicable, NOT an unverified claim: there is no
    press release, no compliance page, and no regulator listing to check, because
    the company no longer publishes a website at all. Searched the Green Button
    Alliance certification/testing material (greenbuttonalliance.org/testing,
    fetched 2026-07-27) — neither AutoGrid nor Uplight appears as a certified DMD
    or CMD implementation.
  claimVsImplementation: |
    Nothing to separate. There is no mandate claim and no implementation. The
    mandate/implementation gap that matters in this sector simply does not arise
    for a vendor that is not a covered entity.

dataStandard:
  implemented: no standard reference found
  detail: |
    No first-party documentation asserting conformance to Green Button / ESPI,
    OpenADR, IEEE 2030.5, CTA-2045, IEC CIM 61968/61970, OCPP, or OCPI could be
    reached. AutoGrid's own site is retired to a redirect stub and the successor's
    developer documentation is behind a login. Third-party trade commentary
    associates DERMS aggregators of this class (naming Uplight/AutoGrid alongside
    EnergyHub) with OpenADR + IEEE 2030.5 + CTA-2045 certification requirements for
    utility program enrollment, but that is commentary, not a published contract or
    a conformance statement, and it is recorded here as unverified context only.

dataSplit:
  consumerDataAPI: false
  consumerDataDetail: |
    No documented way for a third party to obtain an individual customer's usage or
    billing data from AutoGrid. AutoGrid is a business-to-utility platform; the
    customer relationship, the meter, and the billing data all sit with its utility
    clients.
  marketDataOpen: false
  marketDataDetail: |
    AutoGrid publishes no anonymous grid, market, system, or emissions data. There
    is no data portal, no open dataset, and no downloadable feed. This is the
    opposite posture from the ISO/RTO and EIA layer of the same sector — the split
    here is not "open market data, closed consumer data", it is closed on both
    sides, which is the normal shape for a private grid-tech vendor.

access:
  gate: none-published
  gateDetail: |
    AutoGrid itself publishes nothing — there is no signup, no application form, no
    key issuance path, no contact-for-access page, because there is no site. A
    developer who wants this capability today must become a Uplight customer or
    partner: docs.uplight.com is a live ReadMe hub whose every content route
    redirects anonymous visitors to dash.readme.com/to/uplight for login, and
    api.uplight.com rejects anonymous calls with HTTP 401. That successor gate is
    partner-only; it is recorded as context, not as an AutoGrid surface.
  gated: true
  selfServeAvailable: false

auth:
  model: not published
  detail: |
    No authentication scheme is documented for AutoGrid. The successor host
    api.uplight.com returns HTTP 401 with body
    {"errors":[{"message":"Invalid or no token provided"}]} — a bearer-token style
    rejection — but no scheme, no scopes, and no token issuance flow are publicly
    documented, so nothing beyond "a token is required" can be asserted.
  openidConfiguration: |
    https://auto-grid.com/.well-known/openid-configuration returned HTTP 200 but
    with Content-Type text/html and the same 270-byte redirect stub as every other
    path — it is a catch-all response, NOT an OpenID Connect discovery document.
    No OIDC metadata exists.

tlsFinding: |
  auto-grid.com presents an EXPIRED Let's Encrypt certificate. openssl s_client
  (2026-07-27) reports depth=0 CN=auto-grid.com, issuer C=US/O=Let's Encrypt/CN=E8,
  NotBefore 2026-04-25, NotAfter 2026-07-24, verify error num=10 "certificate has
  expired". SANs: auto-grid.com, blog.auto-grid.com, www.auto-grid.com. Plain
  `curl https://auto-grid.com` fails with exit code 60; only `curl -k` succeeds.
  The domain is parked and unmaintained.

