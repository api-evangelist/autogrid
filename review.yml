findings:
  summary: |
    AutoGrid has no public API surface of any kind. This is a built-stub profile:
    identity is solid and well-evidenced, the API surface is genuinely empty.

    The company was a real and significant grid-tech player — founded 2011 by Amit
    Narayan out of Stanford smart-grid research, AutoGrid Flex was one of the
    better-known AI DERMS/VPP platforms sold to investor-owned utilities. It was
    absorbed by Schneider Electric and then sold on to Uplight in a deal that closed
    in early 2024. What remains at auto-grid.com is a 270-byte redirect stub last
    modified 2022-12-07, served on a Let's Encrypt certificate that expired on
    2026-07-24. Every path on the domain returns that same stub with HTTP 200,
    including /openapi.json and /.well-known/openid-configuration, which is exactly
    the trap this bootstrap is meant to avoid: a 200 is not a document. Each of
    those was opened and confirmed to be the redirect HTML, and none was saved.

    On the sector's central question, AutoGrid is the clean negative case. A data
    mandate is not an implementation — but here there is not even a mandate. Green
    Button, the CDR, and Ontario's regulation all bind data custodians. AutoGrid is
    a vendor that consumes utility and device data under commercial contract. It is
    therefore mandate_regime=none and mandate_status=not-applicable, with no claim
    to test and no register to check.

    Both halves of the consumer/market split are closed. No consumer usage or
    billing API. No open grid or market data. The only route to this capability
    today runs through Uplight's gated ReadMe hub and a token-required
    api.uplight.com, i.e. partner/customer only.
  hasPublicAPI: false
  hasDeveloperPortal: false
  hasOpenAPI: false
  hasPublicDocs: false
  hasSDKs: false
  hasSandbox: false
  brandIconFound: false
  brandIconNote: |
    auto-grid.com/favicon.ico returns the 270-byte redirect HTML, not an image. The
    groq placeholder image URL was used per the bootstrap convention.
  recommendation: |
    Keep as a stub with an accurate acquisition trail. If this capability needs to
    be represented as a live API in the catalog, it belongs under an Uplight
    provider record, not AutoGrid — and even there the surface is gated and would
    have to be recorded as partner-only with no harvestable contract. Re-check
    docs.uplight.com periodically in case Uplight opens a public API reference.

enrichmentRound2:
  date: '2026-07-27'
  correction: |
    The headline finding of round 1 — no public API, no portal, no OpenAPI — holds
    and was re-verified. One finding was WRONG and is corrected: "no standard
    reference found". AutoGrid holds three live, publicly evidenced protocol
    certifications (OpenADR 2.0a VTN, OpenADR 2.0b VTN, IEEE 2030.5-2018 / CSIP
    server, SunSpec certificate CS-000074). The evidence was never on auto-grid.com;
    it is published by the OpenADR Alliance and SunSpec Alliance certified-product
    registries, complete with signed Declarations of Conformity, PICS documents and
    an Intertek lab test-results workbook. For a protocol-centric provider, THAT is
    the machine-readable contract, and this profile now carries it.
  artifactsAdded:
  - conformance/autogrid-conformance.yml
  - conformance/autogrid-ieee-2030-5-csip-pics.yml
  - conformance/autogrid-openadr-pics.yml
  - conformance/documents/ (5 mirrored certificate/PICS/DoC PDFs)
  - lifecycle/autogrid-lifecycle.yml
  - packages/autogrid-packages.yml
  - well-known/autogrid-well-known.yml
  - llms/autogrid-llms.txt
  - security/autogrid-domain-security.yml
  pointersWithheld: |
    No WellKnown/SecurityTxt pointer (every /.well-known/ path is a parked-domain
    catch-all, not a document). No SDKs pointer (no client library exists). No
    Authentication, OAuthScopes, Idempotency, StatusPage, Deprecation, Security,
    AsyncAPI, Webhooks, MCPServer or AgentSkill pointer — none of those surfaces
    exists, and emitting one to move the score would be fabrication.

