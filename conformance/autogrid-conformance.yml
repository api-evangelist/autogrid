method: searched
source: >
  SunSpec Alliance certified-product page and certificate (sunspec.org), OpenADR Alliance
  certified-product registry (products.openadr.org) and the signed Declarations of Conformity
  and PICS documents it links, and the AWS Industries blog post co-authored with AutoGrid.
  All fetched 2026-07-27.
note: >
  AutoGrid publishes NO OpenAPI, no developer portal and no public REST contract - that
  finding from the first round stands. But it is wrong to record AutoGrid as having no
  machine-readable contract at all: its contract is expressed as PROTOCOL conformance, not
  as a vendor spec. AutoGrid Systems is a certified OpenADR 2.0a and 2.0b VTN (server) and a
  SunSpec-certified IEEE 2030.5 / CSIP server, and the certifying bodies publish the
  conformance evidence - signed Declarations of Conformity, Protocol Implementation
  Conformance Statements, and a lab test-results sheet. That evidence names the exact
  services, transports, payloads, security profiles and test cases the AutoGrid Flex / DROMS
  server implements. This file records it; the two companion files carry the detail. This
  supersedes the first round's dataStandard finding of "no standard reference found", which
  was based on the retired auto-grid.com website alone.
