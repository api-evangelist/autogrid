summary:
  certified_standards: [openadr-2.0a, openadr-2.0b, ieee-2030-5-csip]
  claimed_only: [soc2, nerc-cip, iso-27001, nist-800-53, gdpr]
  machine_readable_contract: >
    Protocol conformance statements only (OpenADR PICS, IEEE 2030.5 CSIP PICS). No vendor
    API description of any kind.
  authentication_model: mutual TLS with x.509 client certificates (both certified surfaces)
  transports: [Simple HTTP (pull), Simple HTTP (push), XMPP (push), HTTPS/TLS 1.2 (IEEE 2030.5)]
  caveat: >
    Every certification predates or coincides with the Uplight acquisition (closed early
    2024). The certifications are published against the legal entity AutoGrid Systems, Inc.
    and remain listed in both registries as of 2026-07-27, but the products are now sold
    under Uplight and the certification records are not being refreshed under the AutoGrid
    brand.
