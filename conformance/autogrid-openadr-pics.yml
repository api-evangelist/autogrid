registry_description: >
  "AutoGrid DROMS (Demand Response Optimization and Management System) is the world's most
  advanced demand management system. Harnessing Big Data analytics, cloud computing services
  and open standards such as OpenADR, DROMS minimizes the cost of demand management systems
  while expanding their functionality and user base. DROMS' embedded OpenDR 2.0 server is
  scalable to millions of endpoints, highly secure, and can be easily integrated into any
  third party system through web-services APIs." - AutoGrid's own copy in the OpenADR
  certified-product registry. The "web-services APIs" referred to here were never publicly
  documented; the only publicly specified interface is the OpenADR 2.0 protocol itself.
