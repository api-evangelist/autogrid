name: AutoGrid
kind: company
description: AutoGrid Systems is a United States grid-technology company founded in 2011 by
  Amit Narayan in Redwood City, California, that built AI and machine-learning software for
  distributed energy resource management (DERMS), virtual power plants, and automated demand
  response under the AutoGrid Flex platform, selling to investor-owned utilities, retailers,
  and aggregators rather than to end consumers. It sits on the grid-tech / DERMS layer of
  the energy value chain - a buyer and orchestrator of utility and device data, not a data
  custodian - so no Green Button, Consumer Data Right, or smart-meter data-sharing obligation
  attaches to it. Schneider Electric took control of AutoGrid and then sold it to Uplight
  in a deal announced 14 December 2023 and closed in early 2024; auto-grid.com now serves
  only a 270-byte meta-refresh to uplight.com (on an expired TLS certificate as of 27 July
  2026) and every developer, docs, api, and data subdomain fails to resolve. Its API posture
  is therefore honestly none-published - no public developer portal, no OpenAPI, no consumer
  usage API, and no open market data. The successor surface at docs.uplight.com is real but
  fully login-gated, redirecting anonymous visitors to a ReadMe dashboard login, and api.uplight.com
  answers HTTP 401 with "Invalid or no token provided" - partner and customer access only.
